name: anki-mcp
services:
  anki-mcp:
    build: .
    image: anki-mcp:local
    container_name: anki-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      - ANKI_COLLECTION_PATH=/data/collection.anki2
      - ANKI_MEDIA_FOLDER=/data/media
      - ANKI_MCP_HOST=0.0.0.0
      - ANKI_MCP_PORT=8765
      - ANKI_MCP_TOKEN=__SET_VIA_INFISICAL__
      - ANKI_SYNC_URL=
      - ANKI_SYNC_USER=
      - ANKI_SYNC_PW=
    ports:
      - "8765:8765"
    volumes:
      - anki-mcp-data:/data

volumes:
  anki-mcp-data:
    name: anki-mcp-data
