name: anki-sync

services:
  anki-sync:
    container_name: anki-sync
    image: python:3.12-slim
    working_dir: /anki
    command: ["sh","-c","pip install --no-cache-dir anki==25.07.5 && python -m anki.syncserver"]
    ports:
      - "8081:8080"
    environment:
      SYNC_USER1: ${SYNC_USER1}
      SYNC_BASE: "/sync"
      SYNC_HOST: "0.0.0.0"
      SYNC_PORT: "8080"
      SYNC_BASE_URL: "${SYNC_BASE_URL:-https://anki-sync.example.com}"
    volumes:
      - anki-sync:/sync
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8080)); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  mcp:
    container_name: anki-mcp
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: anki-mcp:local
    ports:
      - "8765:8765"
    # ANKI_MCP_TOKEN comes from the .env file (same env_file below). The
    # entrypoint validates that it is set and refuses to start otherwise.
    # The user is free to provision .env however they like — file,
    # secret-manager sidecar, mounted secret, etc. No specific secret-manager
    # CLI is baked into the image.
    env_file:
      - .env
    environment:
      ANKI_MCP_PORT: "8765"
      ANKI_MCP_HOST: "0.0.0.0"
      # Point fastanki at the shared collection, mounted from the anki-sync volume.
      # anki-sync MUST be stopped while mcp writes, then restarted.
      # Note: SYNC_USER1=matthias:#<hash> encodes both username and password.
      # Only the *username* part is the user directory; the #<hash> branch is
      # only created by anki-sync on conflict (see sync_guard.py / check_sync_state).
      # We resolve the username part to a dedicated env var (SYNC_USER1_NAME)
      # because compose interpolation does not support ${VAR%%:*} substring
      # expansion; bash inside the container would also have trouble because
      # compose would already have consumed the ${...} before the shell sees it.
      FASTANKI_DIR: "/sync/${SYNC_USER1_NAME}"
    volumes:
      - anki-mcp-data:/data
      # mount matthias' collection (read-write). Lock conflicts with anki-sync;
      # we stop anki-sync before mcp writes via Arcane redeploy orchestration.
      - anki-sync:/sync:rw
    restart: unless-stopped
    # Order matters: mcp must come up *after* anki-sync is healthy, otherwise
    # the FastAPI server on :8080 may not be listening yet and mcp's first
    # FastAPI sync-handshake can race. We also pin the start order so a
    # manual `docker compose up -d` boots them in the right sequence.
    depends_on:
      anki-sync:
        condition: service_healthy
    healthcheck:
      # Auth is enforced: an unauthenticated request returns 401, which is
      # also a valid "server is up" signal. Any 1xx-4xx means the port is
      # listening; only 5xx / connect-refused fails the check.
      # Note: `$$` in compose escapes to literal `$` for the runtime shell,
      # so the healthcheck receives a syntactically valid `case $code in ...`.
      test:
        - "CMD-SHELL"
        - "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/mcp); case $$code in 1*|2*|3*|4*) exit 0;; *) exit 1;; esac"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  anki-sync:
    name: anki-sync
  anki-mcp-data:
    name: anki-mcp-data
