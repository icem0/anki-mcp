name: anki-sync

services:
  anki-sync:
    container_name: anki-sync
    image: python:3.12-slim
    working_dir: /anki
    command: ["sh","-c","pip install --no-cache-dir anki==25.07.5 && python -m anki.syncserver"]
    ports:
      - "8081:8080"
    environment:
      SYNC_USER1: ${SYNC_USER1}
      SYNC_BASE: "/sync"
      SYNC_HOST: "0.0.0.0"
      SYNC_PORT: "8080"
    volumes:
      - anki-sync:/sync
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8080)); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  mcp:
    container_name: anki-mcp
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: anki-mcp:local
    ports:
      - "8765:8765"
    environment:
      ANKI_MCP_TOKEN: ${ANKI_MCP_TOKEN}
      ANKI_MCP_PORT: "8765"
      ANKI_MCP_HOST: "0.0.0.0"
      # Point fastanki at the same collection the sync server exposes.
      # Both services share the anki-sync volume; see docs/architecture.md.
      FASTANKI_DIR: "/sync/${SYNC_USER1}"
    volumes:
      - anki-mcp-data:/data
      - anki-sync:/sync:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8765)); s.close()'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  anki-sync:
    name: anki-sync
  anki-mcp-data:
    name: anki-mcp-data
